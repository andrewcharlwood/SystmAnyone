[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "systmanyone"
version = "0.1.0"
description = "Unofficial SystmOne clinical template builder"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Andrew Charlwood" }]
keywords = ["systmone", "tpp", "clinical-template", "interoperability", "ehr"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Software Development :: User Interfaces",
    "Intended Audience :: Healthcare Industry",
]
dependencies = ["flask>=2.0"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Source = "https://github.com/andrewcharlwood/SystmAnyone"

[project.scripts]
systmanyone = "systmanyone.server:main"

[tool.setuptools]
packages = ["systmanyone"]

[tool.setuptools.package-data]
systmanyone = ["data/*.csv.gz", "data/*.md", "static/*.html", "static/*.css", "static/js/*.js"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
